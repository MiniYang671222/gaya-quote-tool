<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GAYA HOTEL 2026 專業報價工具 V4</title>
    <style>
        :root {
            --block-red: #FF1744; --block-red-dark: #D50000;
            --block-blue: #2979FF; --block-blue-dark: #2962FF;
            --block-yellow: #FFC400; --block-yellow-dark: #FFAB00;
            --bg-color: #f4f5f7; --card-bg: #ffffff;
            --text-primary: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text-primary); margin: 0; padding: 20px 10px; min-height: 100vh;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--block-blue) 15%, transparent 16%), radial-gradient(var(--block-yellow) 15%, transparent 16%);
            background-size: 60px 60px; background-position: 0 0, 30px 30px;
            display: flex; justify-content: center;
        }

        .container {
            background-color: var(--card-bg); padding: 25px 20px; border-radius: 20px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1), 0 20px 40px rgba(0,0,0,0.15);
            border: 4px solid #fff; width: 100%; max-width: 600px; position: relative;
        }

        h2 { text-align: center; margin: 10px 0 25px 0; font-weight: 900; line-height: 1.2;}
        .title-accent {
            display: inline-block; background-color: var(--block-blue); color: white;
            padding: 5px 15px; border-radius: 10px; transform: rotate(-1deg); font-size: 1.2rem;
        }

        label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 0.9rem; color: #555; }
        input[type="date"], input[type="number"], select, textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #eee;
            box-sizing: border-box; font-size: 16px; font-weight: 600; background: #fafafa;
        }

        .form-group { margin-bottom: 20px; }
        .room-card {
            background-color: #fff; border: 3px solid #eee; border-radius: 16px;
            padding: 16px; margin-bottom: 15px; position: relative; transition: 0.3s;
        }
        .room-card:hover { border-color: var(--block-blue); }

        .room-number-badge {
            color: white; font-size: 0.8rem; padding: 4px 10px; border-radius: 6px;
            font-weight: 800; display: inline-block; margin-bottom: 12px; background-color: var(--block-blue);
        }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: 900; cursor: pointer; transition: all 0.1s;
        }
        .btn-blue { background-color: var(--block-blue); color: white; box-shadow: 0 5px 0 var(--block-blue-dark); margin-bottom: 10px; }
        .btn-yellow { background-color: var(--block-yellow); color: #4a3b00; box-shadow: 0 5px 0 var(--block-yellow-dark); margin-top: 10px;}
        .btn-red { background-color: var(--block-red); color: white; box-shadow: 0 5px 0 var(--block-red-dark); }
        .btn:active { transform: translateY(4px); box-shadow: none; }

        .btn-delete {
            background: #fff; border: 1px solid var(--block-red); color: var(--block-red);
            padding: 4px 8px; border-radius: 5px; cursor: pointer; float: right; font-weight: bold;
        }

        #outputArea {
            height: 280px; margin-top: 15px; background-color: #2c3e50; color: #ecf0f1;
            font-family: 'Courier New', monospace; padding: 15px; border-radius: 10px; border: none;
            font-size: 14px; line-height: 1.6;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>THE GAYA HOTEL<br><span class="title-accent">2026 全年度報價系統</span></h2>
    
    <div class="form-group">
        <label>📅 預計入住日期</label>
        <input type="date" id="date" min="2026-01-01" max="2026-12-31" value="2026-01-01">
    </div>

    <div class="form-group">
        <label>🏨 房型與餐飲設定</label>
        <div id="roomSelectionContainer"></div>
        <button class="btn btn-blue" onclick="addRoomSelection()">✚ 增加房型項目</button>
    </div>

    <button class="btn btn-yellow" onclick="calculateQuote()">🧱 生成即時報價單 🧱</button>

    <div class="form-group" style="margin-top: 20px;">
        <textarea id="outputArea" readonly placeholder="點擊上方按鈕生成報價..."></textarea>
        <button class="btn btn-red hidden" id="copyBtn" onclick="copyToClipboard()" style="margin-top:10px">📋 複製報價內容</button>
    </div>
</div>

<script>
    const roomData = {
        "雅緻雙人房(一大床)": { weekday: 4100, peak: 4600, holiday: 5400, bigHoliday: 6200, limit: 48, cap: 2 },
        "雅緻雙人房(二小床)": { weekday: 4100, peak: 4600, holiday: 5400, bigHoliday: 6200, limit: 41, cap: 2 },
        "雅緻三人房(三小床)": { weekday: 5300, peak: 5800, holiday: 6300, bigHoliday: 7100, limit: 8, cap: 3 },
        "精彩家庭房(二中床)": { weekday: 5900, peak: 6400, holiday: 7200, bigHoliday: 8000, limit: 26, cap: 4 },
        "豪華家庭房(二大床)": { weekday: 6900, peak: 7400, holiday: 8200, bigHoliday: 9000, limit: 8, cap: 4 },
        "景觀豪華家庭房": { weekday: 7900, peak: 8400, holiday: 9200, bigHoliday: 10000, limit: 8, cap: 4 }
    };

    const config = {
        inquiry: { start: "2026-02-14", end: "2026-02-22" },
        ironman: ["2026-04-24", "2026-04-25"], 
        specialBig: ["2026-10-24", "2026-10-25", "2026-12-31"],
        // 確保 09-25, 09-26, 09-27 都在這裡
        longHolidays: [
            "2026-01-01", "2026-01-02", "2026-02-27", "2026-04-02", "2026-04-03", 
            "2026-04-04", "2026-05-01", "2026-05-02", "2026-06-19", "2026-06-20", 
            "2026-09-25", "2026-09-26", "2026-09-27", "2026-10-09", "2026-10-10"
        ]
    };

    function getDateType(dateStr) {
        // 1. 優先判定：手動指定的特殊大假日 (包含 9/25-27)
        if (config.specialBig.includes(dateStr) || config.longHolidays.includes(dateStr)) {
            return "bigHoliday";
        }

        // 2. 判定：春節或鐵人三項 (顯示特殊報價提示)
        if (dateStr >= config.inquiry.start && dateStr <= config.inquiry.end) return "inquiry";
        if (config.ironman.includes(dateStr)) return "ironman";

        const date = new Date(dateStr);
        const month = date.getMonth() + 1;
        const day = date.getDay(); 
        const isSummer = (month === 7 || month === 8);

        // 3. 判定：暑假
        if (isSummer) {
            return (day === 6) ? "bigHoliday" : "peak";
        }

        // 4. 判定：一般週六
        if (day === 6) return "holiday";

        // 5. 其他皆為平日
        return "weekday";
    }

    // --- 以下為原本的計算與 UI 功能，保持不變 ---

    function addRoomSelection() {
        const container = document.getElementById('roomSelectionContainer');
        const div = document.createElement('div');
        div.className = 'room-card';
        const options = Object.keys(roomData).map(name => `<option value="${name}">${name}</option>`).join('');
        div.innerHTML = `
            <button class="btn-delete" onclick="this.parentElement.remove()">移除</button>
            <span class="room-number-badge">房型項目</span>
            <div style="margin-bottom:10px">
                <label>選擇房型 (含早餐)</label>
                <select class="r-type">${options}</select>
            </div>
            <div style="display:flex; gap:10px;">
                <div style="flex:1"><label>間數</label><input type="number" class="r-qty" value="1" min="1"></div>
                <div style="flex:2">
                    <label>🍴 加購晚餐方案</label>
                    <select class="r-dinner">
                        <option value="0">不加購 (純房含早)</option>
                        <option value="800">加購晚餐 800/人</option>
                        <option value="1000">加購晚餐 1000/人</option>
                    </select>
                </div>
            </div>
        `;
        container.appendChild(div);
    }

    function calculateQuote() {
        const dateStr = document.getElementById('date').value;
        const roomCards = document.querySelectorAll('.room-card');
        const output = document.getElementById('outputArea');
        if (!dateStr || roomCards.length === 0) { alert("請填寫日期並加入房型"); return; }

        const dateType = getDateType(dateStr);
        
        if (dateType === "inquiry" || dateType === "ironman") {
            let reason = dateType === "inquiry" ? "農曆春節特殊日" : "國際鐵人三項期間";
            output.value = `【THE GAYA HOTEL 報價通知】\n日期：${dateStr}\n------------------------------\n此區間為 ${reason}，\n特殊報價請洽詢業務。\n\n以上為參考報價，可依實際預算與業務聯繫協商報價。`;
            document.getElementById('copyBtn').classList.remove('hidden');
            return;
        }

        let isHolidayType = (dateType === "holiday" || dateType === "bigHoliday");
        let roomDiscount = isHolidayType ? 200 : 300;
        let aggregateQty = {};
        let items = [];

        roomCards.forEach(card => {
            const type = card.querySelector('.r-type').value;
            const qty = parseInt(card.querySelector('.r-qty').value) || 0;
            const dinnerPrice = parseInt(card.querySelector('.r-dinner').value);
            aggregateQty[type] = (aggregateQty[type] || 0) + qty;
            items.push({ type, qty, dinnerPrice });
        });

        for (let type in aggregateQty) {
            if (aggregateQty[type] > roomData[type].limit) {
                alert(`警告：${type} 需求 ${aggregateQty[type]} 間已超過飯店上限 ${roomData[type].limit} 間！`);
                return;
            }
        }

        let typeLabel = { weekday:"平日", peak:"旺日(暑假)", holiday:"假日", bigHoliday:"大假日" }[dateType];
        let text = `【THE GAYA HOTEL 報價單】\n入住日期：${dateStr} (${typeLabel})\n------------------------------\n`;
        let totalAll = 0;

        items.forEach((item, idx) => {
            const basePrice = roomData[item.type][dateType];
            const cap = roomData[item.type].cap;
            let currentRoomPrice = basePrice;
            let dinnerInfo = "";

            if (item.dinnerPrice > 0) {
                currentRoomPrice = basePrice - roomDiscount;
                const dinnerSub = item.dinnerPrice * cap * item.qty;
                const roomSub = currentRoomPrice * item.qty;
                totalAll += (roomSub + dinnerSub);
                dinnerInfo = `   + 晚餐 $${item.dinnerPrice}/人 (每房減免$${roomDiscount})\n   小計：$${(roomSub+dinnerSub).toLocaleString()}\n`;
            } else {
                const roomSub = basePrice * item.qty;
                totalAll += roomSub;
                dinnerInfo = `   小計：$${roomSub.toLocaleString()}\n`;
            }

            text += `${idx+1}. ${item.type} x ${item.qty}間\n`;
            text += `   房價：$${currentRoomPrice.toLocaleString()}/間\n${dinnerInfo}`;
        });

        text += `------------------------------\n總計預估金額：NT$ ${totalAll.toLocaleString()}\n(含稅及服務費)\n報價有效期至 2026/12/31止。\n\n以上為參考報價，可依實際預算與業務聯繫協商報價。`;
        output.value = text;
        document.getElementById('copyBtn').classList.remove('hidden');
        output.scrollTop = 0;
    }

    function copyToClipboard() {
        const area = document.getElementById('outputArea');
        area.select();
        document.execCommand('copy');
        alert("報價單已成功複製！");
    }

    window.onload = addRoomSelection;
</script>
</script>

</body>
</html>
